name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The hooks run wherever Claude Code does; the author uses Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # The tests make real throwaway git repos; commits there need an identity.
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: python -m pytest tests -q
